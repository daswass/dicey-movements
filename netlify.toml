[build]
  command = "npm ci --prefix backend && npm run test:all && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/service-worker.js"
  to = "/service-worker.js"
  status = 200

# Merges to main intentionally trigger the Netlify production deploy.
